name: Bitcoin Traffic Analyzer CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy

      - name: Run Flake8 linting
        run: |
          flake8 src/ dashboard/ tests/ \
            --max-line-length=120 \
            --exclude=__pycache__,.venv \
            --ignore=E501,W503,E203

      - name: Run MyPy type checking
        run: |
          mypy src/ dashboard/ tests/ --ignore-missing-imports

  test-ingestion:
    name: Test — Ingestion & Graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingestion & graph tests
        run: |
          python -m pytest tests/test_ingestion.py tests/test_graph.py -v --tb=short

  test-features:
    name: Test — Feature Engineering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run feature engineering tests
        run: |
          python -m pytest tests/test_features.py -v --tb=short

  test-models:
    name: Test — ML Models & Correlation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ML model & correlation tests
        run: |
          python -m pytest tests/test_models.py -v --tb=short

  test-scoring:
    name: Test — Scoring & Reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scoring & report tests
        run: |
          python -m pytest tests/test_scoring.py -v --tb=short

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test-ingestion, test-features, test-models, test-scoring]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify all imports resolve
        run: |
          python -c "from src.scoring import run_full_pipeline; print('Pipeline import OK')"
          python -c "from dashboard.app import main; print('Dashboard import OK')"
          python -c "from dashboard.report_export import generate_case_report; print('Report export import OK')"

      - name: Generate synthetic data & run pipeline smoke test
        run: |
          python data/synthetic_generator.py --output data/raw/synthetic_transactions.csv
          python -m src.scoring --input data/raw/synthetic_transactions.csv --output data/processed
          echo "Pipeline executed successfully!"

      - name: Verify output artifacts
        run: |
          test -f data/processed/scored_alerts.csv && echo "✓ scored_alerts.csv"
          test -f data/processed/scored_alerts.json && echo "✓ scored_alerts.json"
          test -f data/processed/coinjoin_transactions.csv && echo "✓ coinjoin_transactions.csv"
          test -f data/processed/peel_chains.json && echo "✓ peel_chains.json"
          test -f data/processed/wallet_clusters.csv && echo "✓ wallet_clusters.csv"
          test -f data/processed/evaluation_metrics.json && echo "✓ evaluation_metrics.json"
